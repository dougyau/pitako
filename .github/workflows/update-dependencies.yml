name: Update dependencies

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      candidate-tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Update runtime dependencies and metadata
        run: bun scripts/update-dependencies.ts
      - name: Prepare checkout without CodeGraph indexing
        run: bash scripts/setup.sh --skip-codegraph
      - run: bun run typecheck
      - run: bun run test
      - run: git diff --check
      - id: candidate
        name: Identify verified candidate
        run: |
          git add -- package.json bun.lock config/stack.json THIRD_PARTY.md docs/dependency-releases.json
          git diff --exit-code
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - name: Save verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-update
          if-no-files-found: error
          path: |
            package.json
            bun.lock
            config/stack.json
            THIRD_PARTY.md
            docs/dependency-releases.json

  pull-request:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Dependency code runs only in the read-only job, not with this token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.base-sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-update
      - name: Check downloaded candidate before publication
        env:
          VERIFIED_TREE: ${{ needs.verify.outputs.candidate-tree }}
        run: |
          git add -- package.json bun.lock config/stack.json THIRD_PARTY.md docs/dependency-releases.json
          test "$(git write-tree)" = "$VERIFIED_TREE"
      - name: Create or update dependency PR
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-dependencies
          delete-branch: true
          commit-message: Update runtime dependencies
          title: Update runtime dependencies
          body: |
            Update npm runtime dependencies with exact versions and a regenerated Bun lockfile.
            Keep Pi host packages and the Git-pinned LSP dependency unchanged.

            Checkout preparation, typecheck, tests, and diff checks passed before this PR was updated.
            Auto-merge is requested only for the verified candidate, respecting branch protection rules.
            This workflow does not publish npm releases.
          add-paths: |
            package.json
            bun.lock
            config/stack.json
            THIRD_PARTY.md
            docs/dependency-releases.json
      - name: Merge verified dependency update
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          VERIFIED_TREE: ${{ needs.verify.outputs.candidate-tree }}
        run: |
          tree=$(gh api "repos/$GH_REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')
          if [[ "$tree" != "$VERIFIED_TREE" ]]; then
            echo "::error::PR differs from the verified candidate; refusing auto-merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
