# Example only: copy deliberately into your private Pitako config, not defaults.
# These profiles change capacity, never Developer responsibility or authority.
# The internal Head policy does not inherit the legacy Developer primary/fallbacks.
# Only asynchronous Developer mode=head uses it; writes must be explicit.
# Omitted mode and agent_run remain ordinary. Head and leaf reasoning are independent.
[model_policies.developer_head.primary]
model = "example/head-model"
reasoning = "default"

[head_developer]
max_parallel = 3

# Optional advice uses this exact Pi classifier identity; direct/default skip it.
[developer_routing]
classifier_provider = "example"
classifier_model = "capacity-classifier"

[model_policies.developer_senior.primary]
model = "openai/gpt-6.1-sol"
reasoning = "high"

[model_policies.developer_mid.primary]
model = "openai/gpt-6.1-sol"
reasoning = "medium"

[model_policies.developer_junior.primary]
model = "openai/gpt-6-luna"
reasoning = "medium"
